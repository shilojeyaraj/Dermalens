version: 2
updates:
  # Frontend npm dependencies (package.json at repo root)
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Batch low-risk updates into a single PR to reduce noise.
      minor-and-patch:
        update-types: ["minor", "patch"]

  # Backend runtime dependencies (deployed service)
  - package-ecosystem: pip
    directory: "/apps/api"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  # Backend dev/test tooling (requirements-dev.txt at repo root)
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # GitHub Actions used in workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
