name: Release

# Triggered by pushing a semver tag, e.g.  git tag v1.2.0 && git push origin v1.2.0
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write # required to create a GitHub Release

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true # auto-generate notes from merged PRs/commits
          draft: false
          prerelease: false
