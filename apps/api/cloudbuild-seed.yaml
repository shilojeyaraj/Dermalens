steps:
  # Build the seeding job container
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/dermalens-seed', './']
  
  # Push the container to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/dermalens-seed']
  
  # Deploy as Cloud Run job
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'jobs'
      - 'replace'
      - 'dermalens-seed'
      - '--image=gcr.io/$PROJECT_ID/dermalens-seed'
      - '--region=us-central1'
      - '--memory=2Gi'
      - '--cpu=2'
      - '--max-retries=3'
      - '--parallelism=1'
      - '--task-count=1'
      - '--task-timeout=600s'
      - '--set-env-vars=ELASTICSEARCH_URL=${_ELASTICSEARCH_URL}'
      - '--set-env-vars=ELASTICSEARCH_USERNAME=${_ELASTICSEARCH_USERNAME}'
      - '--set-env-vars=ELASTICSEARCH_PASSWORD=${_ELASTICSEARCH_PASSWORD}'

# Substitution variables
substitutions:
  _ELASTICSEARCH_URL: 'https://126ac4035b474479a8228759b486116b.us-central1.gcp.cloud.es.io:443'
  _ELASTICSEARCH_USERNAME: 'elastic'
  _ELASTICSEARCH_PASSWORD: 'your_password_here'

options:
  logging: CLOUD_LOGGING_ONLY
