# Local development stack: frontend + backend + their common dependencies.
# Copy .env.example to .env first; values below are safe local defaults.
#
#   docker compose up --build

services:
  # Elasticsearch — product search index
  elasticsearch:
    image: elasticsearch:8.11.0
    container_name: dermalens-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - dermalens-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Redis — caching (stub)
  redis:
    image: redis:7-alpine
    container_name: dermalens-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - dermalens-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # PostgreSQL — local alternative to Supabase (stub)
  postgres:
    image: postgres:15-alpine
    container_name: dermalens-postgres
    environment:
      POSTGRES_DB: dermalens
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dermalens-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Backend API (FastAPI — apps/api, the deployed service)
  backend:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: dermalens-backend
    env_file:
      - .env
    environment:
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - REDIS_URL=redis://redis:6379
      - DEBUG=true
    ports:
      - "8000:8000"
    depends_on:
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - dermalens-network

  # Frontend (Next.js — repo root)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: dermalens-frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - dermalens-network

volumes:
  elasticsearch_data:
    driver: local
  redis_data:
    driver: local
  postgres_data:
    driver: local

networks:
  dermalens-network:
    driver: bridge
