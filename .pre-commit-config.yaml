# Pre-commit hooks — run formatters/linters automatically before each commit.
#
#   pip install pre-commit
#   pre-commit install            # enable the git hook
#   pre-commit run --all-files    # run against the whole repo once
#
# Frontend (TS/JS) is handled by Prettier; backend (apps/api) by Black/isort/flake8.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '^docs/archive/'
      - id: end-of-file-fixer
        exclude: '^docs/archive/'
      - id: check-yaml
      - id: check-json
        # .eslintrc.json / tsconfig*.json use JSONC (comments), which strict JSON rejects.
        exclude: '(^\.eslintrc\.json$|tsconfig.*\.json$)'
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=1024']
      - id: detect-private-key

  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
        files: ^apps/api/
        args: ['--line-length=100']

  - repo: https://github.com/pycqa/isort
    rev: 6.0.1
    hooks:
      - id: isort
        files: ^apps/api/
        args: ['--profile=black', '--line-length=100']

  - repo: https://github.com/pycqa/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        files: ^apps/api/
        # Block commits only on real errors (syntax/undefined names);
        # broader style is reported by CI's informational flake8 pass.
        args: ['--select=E9,F63,F7,F82']

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        files: '\.(ts|tsx|js|jsx|json|css|md)$'
        exclude: '(^docs/archive/|^apps/api/|package-lock\.json|^\.eslintrc\.json$)'
